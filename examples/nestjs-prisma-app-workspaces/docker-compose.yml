version: '3'
services:
  postgres:
    image: postgres
    ports:
      - '5433:5432'
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=nestjs_prisma
  # Optional: only used when REDIS_AUTHZ_CACHE / REDIS_RATE_LIMIT is true (see README,
  # "Optional: Redis"). Start just this one with: docker compose up -d redis
  redis:
    image: redis:7
    ports:
      - '6379:6379'

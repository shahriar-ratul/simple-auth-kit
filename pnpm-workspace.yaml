packages:
  - "registry/core"
  - "registry/combos/*"
  - "cli"
  - "packages/*"
  - "apps/*"

allowBuilds:
  '@prisma/engines': true
  '@scarf/scarf': true
  argon2: true
  esbuild: true
  prisma: true

minimumReleaseAgeExclude:
  - pg-protocol@1.16.0
  - pg@8.23.0
  - '@simple-auth-kit/auth-client@1.0.0'

overrides:
  # react-native-css@3.0.7 (the engine under nativewind@5.0.0-preview.4) drives lightningcss
  # through a JS visitor, and lightningcss >= 1.31.0 changed how optional struct fields
  # round-trip through that visitor. The result is a hard bundling failure on the very first
  # Tailwind v4 stylesheet ("failed to deserialize; expected an object-like struct named
  # Specifier/ParsedComponent, found ()"), not a warning. react-native-css itself already refuses
  # 1.30.2 by name for a related reason.
  #
  # It has to be pinned *here* rather than in the apps: react-native-css deliberately resolves
  # lightningcss from @expo/metro-config (see its lightningcss-loader.js), so an app-level
  # dependency is not what it loads. @expo/metro-config asks for ^1.30.1 and would otherwise
  # float to the latest.
  #
  # Scoped to @expo/metro-config so nothing else in the workspace is affected. Lift it when
  # react-native-css supports a newer lightningcss.
  "@expo/metro-config>lightningcss": "1.30.1"

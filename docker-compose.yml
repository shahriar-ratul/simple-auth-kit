services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_HOST_AUTH_METHOD: trust
    # Not published to the host on purpose: avoids colliding with a developer's own
    # Postgres already running on localhost:55432 for the non-Docker workflow (see README
    # Prerequisites). Reachable only from other containers on the compose network, as
    # `postgres:5432`.
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7
    # Login rate-limit counters for the 8 backends (REDIS_RATE_LIMIT below), so a limit holds no
    # matter which replica answers. Not published to the host, like postgres; each backend uses
    # its own Redis database number so their counters never collide.
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  # --- base variant (roles/permissions global to the deployment), ports 3001-3004 ---

  nestjs-prisma-app:
    build:
      context: .
      dockerfile: examples/nestjs-prisma-app/Dockerfile
    environment:
      # Overrides the checked-in examples/nestjs-prisma-app/.env, which points at the
      # host's localhost:55432 — dotenv (used by this app and by Prisma) never overwrites
      # an already-set process env var, so this wins.
      DATABASE_URL: postgresql://postgres@postgres:5432/example_nestjs_prisma?schema=public
      # Rate limiter only: the permission cache stays in memory (REDIS_AUTHZ_CACHE unset).
      REDIS_URL: redis://redis:6379/0
      REDIS_RATE_LIMIT: "true"
      PORT: "3001"
      # From the repo-root .env (copy .env.example and fill in with `openssl rand -base64 32`).
      AUTH_JWT_SECRET: ${AUTH_JWT_SECRET_NESTJS_PRISMA:?set AUTH_JWT_SECRET_NESTJS_PRISMA in .env}
    ports:
      - "3001:3001"
    # Logs land at ./logs/nestjs-prisma-app/<YYYY-MM-DD>/... on the host, surviving container
    # recreation. Point a Filebeat/Logstash `paths` glob at logs/nestjs-prisma-app/*/info.log,
    # logs/nestjs-prisma-app/*/warn.log, logs/nestjs-prisma-app/*/error.log (not the per-module
    # subfolders, or every line is double-ingested).
    volumes:
      - ./logs/nestjs-prisma-app:/app/logs
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  nestjs-drizzle-app:
    build:
      context: .
      dockerfile: examples/nestjs-drizzle-app/Dockerfile
    environment:
      DATABASE_URL: postgresql://postgres@postgres:5432/example_nestjs_drizzle?schema=public
      # Rate limiter only: the permission cache stays in memory (REDIS_AUTHZ_CACHE unset).
      REDIS_URL: redis://redis:6379/1
      REDIS_RATE_LIMIT: "true"
      PORT: "3002"
      AUTH_JWT_SECRET: ${AUTH_JWT_SECRET_NESTJS_DRIZZLE:?set AUTH_JWT_SECRET_NESTJS_DRIZZLE in .env}
    ports:
      - "3002:3002"
    volumes:
      - ./logs/nestjs-drizzle-app:/app/logs
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  express-prisma-app:
    build:
      context: .
      dockerfile: examples/express-prisma-app/Dockerfile
    environment:
      DATABASE_URL: postgresql://postgres@postgres:5432/example_express_prisma?schema=public
      # Rate limiter only: the permission cache stays in memory (REDIS_AUTHZ_CACHE unset).
      REDIS_URL: redis://redis:6379/2
      REDIS_RATE_LIMIT: "true"
      PORT: "3003"
      AUTH_JWT_SECRET: ${AUTH_JWT_SECRET_EXPRESS_PRISMA:?set AUTH_JWT_SECRET_EXPRESS_PRISMA in .env}
    ports:
      - "3003:3003"
    volumes:
      - ./logs/express-prisma-app:/app/logs
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  express-drizzle-app:
    build:
      context: .
      dockerfile: examples/express-drizzle-app/Dockerfile
    environment:
      DATABASE_URL: postgresql://postgres@postgres:5432/example_express_drizzle?schema=public
      # Rate limiter only: the permission cache stays in memory (REDIS_AUTHZ_CACHE unset).
      REDIS_URL: redis://redis:6379/3
      REDIS_RATE_LIMIT: "true"
      PORT: "3004"
      AUTH_JWT_SECRET: ${AUTH_JWT_SECRET_EXPRESS_DRIZZLE:?set AUTH_JWT_SECRET_EXPRESS_DRIZZLE in .env}
    ports:
      - "3004:3004"
    volumes:
      - ./logs/express-drizzle-app:/app/logs
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # --- workspaces variant (users belong to workspaces, X-Workspace-Id header), ports 3005-3008 ---

  nestjs-prisma-app-workspaces:
    build:
      context: .
      dockerfile: examples/nestjs-prisma-app-workspaces/Dockerfile
    environment:
      DATABASE_URL: postgresql://postgres@postgres:5432/example_nestjs_prisma_workspaces?schema=public
      # Rate limiter only: the permission cache stays in memory (REDIS_AUTHZ_CACHE unset).
      REDIS_URL: redis://redis:6379/4
      REDIS_RATE_LIMIT: "true"
      PORT: "3005"
      AUTH_JWT_SECRET: ${AUTH_JWT_SECRET_NESTJS_PRISMA_WORKSPACES:?set AUTH_JWT_SECRET_NESTJS_PRISMA_WORKSPACES in .env}
    ports:
      - "3005:3005"
    volumes:
      - ./logs/nestjs-prisma-app-workspaces:/app/logs
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  nestjs-drizzle-app-workspaces:
    build:
      context: .
      dockerfile: examples/nestjs-drizzle-app-workspaces/Dockerfile
    environment:
      DATABASE_URL: postgresql://postgres@postgres:5432/example_nestjs_drizzle_workspaces?schema=public
      # Rate limiter only: the permission cache stays in memory (REDIS_AUTHZ_CACHE unset).
      REDIS_URL: redis://redis:6379/5
      REDIS_RATE_LIMIT: "true"
      PORT: "3006"
      AUTH_JWT_SECRET: ${AUTH_JWT_SECRET_NESTJS_DRIZZLE_WORKSPACES:?set AUTH_JWT_SECRET_NESTJS_DRIZZLE_WORKSPACES in .env}
    ports:
      - "3006:3006"
    volumes:
      - ./logs/nestjs-drizzle-app-workspaces:/app/logs
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  express-prisma-app-workspaces:
    build:
      context: .
      dockerfile: examples/express-prisma-app-workspaces/Dockerfile
    environment:
      DATABASE_URL: postgresql://postgres@postgres:5432/example_express_prisma_workspaces?schema=public
      # Rate limiter only: the permission cache stays in memory (REDIS_AUTHZ_CACHE unset).
      REDIS_URL: redis://redis:6379/6
      REDIS_RATE_LIMIT: "true"
      PORT: "3007"
      AUTH_JWT_SECRET: ${AUTH_JWT_SECRET_EXPRESS_PRISMA_WORKSPACES:?set AUTH_JWT_SECRET_EXPRESS_PRISMA_WORKSPACES in .env}
    ports:
      - "3007:3007"
    volumes:
      - ./logs/express-prisma-app-workspaces:/app/logs
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  express-drizzle-app-workspaces:
    build:
      context: .
      dockerfile: examples/express-drizzle-app-workspaces/Dockerfile
    environment:
      DATABASE_URL: postgresql://postgres@postgres:5432/example_express_drizzle_workspaces?schema=public
      # Rate limiter only: the permission cache stays in memory (REDIS_AUTHZ_CACHE unset).
      REDIS_URL: redis://redis:6379/7
      REDIS_RATE_LIMIT: "true"
      PORT: "3008"
      AUTH_JWT_SECRET: ${AUTH_JWT_SECRET_EXPRESS_DRIZZLE_WORKSPACES:?set AUTH_JWT_SECRET_EXPRESS_DRIZZLE_WORKSPACES in .env}
    ports:
      - "3008:3008"
    volumes:
      - ./logs/express-drizzle-app-workspaces:/app/logs
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # The dev portal is deliberately NOT a service here. It starts and stops these
  # containers, so running it inside compose would mean it kills itself on "stop
  # all" — and controlling Docker from a container would mean mounting the Docker
  # socket, which effectively grants host root. It runs on the host instead:
  #   pnpm portal   ->   http://localhost:8080

  admin-nextjs:
    build:
      context: .
      dockerfile: apps/admin-nextjs/Dockerfile
    environment:
      # Browser-facing: the browser runs on the host, not inside the compose network, so
      # this must be the host-published port, not the internal service DNS name.
      NEXT_PUBLIC_AUTH_API_URL: http://localhost:3001
      # Server-side calls (NextAuth authorize, proxy token verify) run inside this container,
      # where localhost:3001 is the container itself — name the backend by its service DNS.
      AUTH_API_INTERNAL_URL: http://nestjs-prisma-app:3001
      # NextAuth session-JWT signing secret, from the repo-root .env.
      AUTH_SECRET: ${AUTH_SECRET:?set AUTH_SECRET in .env}
    ports:
      - "3000:3000"
    depends_on:
      - nestjs-prisma-app

  admin-react:
    build:
      context: .
      dockerfile: apps/admin-react/Dockerfile
    environment:
      VITE_AUTH_API_URL: http://localhost:3001
    ports:
      - "5173:5173"
    depends_on:
      - nestjs-prisma-app

  admin-nextjs-workspaces:
    build:
      context: .
      dockerfile: apps/admin-nextjs-workspaces/Dockerfile
    environment:
      NEXT_PUBLIC_AUTH_API_URL: http://localhost:3005
      AUTH_API_INTERNAL_URL: http://nestjs-prisma-app-workspaces:3005
    ports:
      - "3010:3010"
    depends_on:
      - nestjs-prisma-app-workspaces

  admin-react-workspaces:
    build:
      context: .
      dockerfile: apps/admin-react-workspaces/Dockerfile
    environment:
      VITE_AUTH_API_URL: http://localhost:3005
    ports:
      - "5174:5174"
    depends_on:
      - nestjs-prisma-app-workspaces

volumes:
  postgres-data:

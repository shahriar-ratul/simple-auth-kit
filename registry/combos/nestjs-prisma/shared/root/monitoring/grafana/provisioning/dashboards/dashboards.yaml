apiVersion: 1

providers:
  - name: simple-auth-kit
    orgId: 1
    type: file
    # Edits made in the UI are kept (they are not written back to the mounted file, which is
    # read-only) — useful for trying a panel out; copy anything worth keeping into the JSON.
    allowUiUpdates: true
    disableDeletion: false
    updateIntervalSeconds: 30
    options:
      path: /var/lib/grafana/dashboards
      foldersFromFilesStructure: false

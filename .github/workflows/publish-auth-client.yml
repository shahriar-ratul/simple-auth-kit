name: Publish auth-client

# Runs whenever packages/auth-client changes on main. Publishing is gated on the version in
# package.json actually being new — bump it as part of your commit to trigger a release;
# pushing without a version bump is a no-op (the compare-versions step just skips publish).
on:
  push:
    branches: [main]
    paths:
      - "packages/auth-client/**"
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # packages/auth-client is a real member of this repo's pnpm workspace (see
      # pnpm-workspace.yaml — "packages/*"), so it's installed the same way the rest of the repo
      # is: `pnpm install`. A fresh CI checkout has no pre-hoisted node_modules to fall back on
      # (unlike a local machine that already ran a root `pnpm install`), and plain `npm install`
      # from scratch here hits npm's known arborist crash ("Cannot read properties of null
      # (reading 'edgesOut')") — pnpm doesn't have that bug and is this repo's actual package
      # manager anyway. `npm publish` at the end is still plain npm — that part talks to the npm
      # registry directly and has nothing to do with how dependencies got installed.
      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: "https://registry.npmjs.org"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        working-directory: packages/auth-client
        run: pnpm run typecheck

      - name: Test
        working-directory: packages/auth-client
        run: pnpm run test

      - name: Build
        working-directory: packages/auth-client
        run: pnpm run build

      # Compares package.json's version against what's already live on npm.
      #  - same version            -> skip (safe no-op; re-running this workflow, or pushing an
      #                                unrelated change under packages/auth-client/, must not
      #                                re-attempt a publish that would just fail anyway)
      #  - no published version yet -> publish (first-ever release)
      #  - strictly newer           -> publish
      #  - anything else (lower, or not valid semver relative to published) -> FAIL the job.
      #    `npm publish` moves the `latest` dist-tag to whatever it just published regardless of
      #    semver order, so silently publishing a non-newer version would silently move `latest`
      #    backwards — that must stop the workflow, not skip quietly.
      - name: Compare versions
        id: version-check
        working-directory: packages/auth-client
        run: |
          LOCAL_VERSION=$(node -p "require('./package.json').version")
          PKG_NAME=$(node -p "require('./package.json').name")
          PUBLISHED_VERSION=$(npm view "$PKG_NAME" version 2>/dev/null || echo "")
          echo "local version: $LOCAL_VERSION"
          echo "published version: ${PUBLISHED_VERSION:-<none, first publish>}"

          if [ -z "$PUBLISHED_VERSION" ]; then
            echo "no published version yet — publishing $LOCAL_VERSION"
            echo "skip=false" >> "$GITHUB_OUTPUT"
          elif [ "$LOCAL_VERSION" = "$PUBLISHED_VERSION" ]; then
            echo "already published — skipping"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          elif npx --yes semver@7 -r ">$PUBLISHED_VERSION" "$LOCAL_VERSION" > /dev/null 2>&1; then
            echo "newer than published — publishing"
            echo "skip=false" >> "$GITHUB_OUTPUT"
          else
            echo "::error::package.json version ($LOCAL_VERSION) is not newer than the published version ($PUBLISHED_VERSION). Bump the version forward before merging — publishing a non-newer version would move npm's 'latest' tag backwards."
            exit 1
          fi

      - name: Publish to npm
        if: steps.version-check.outputs.skip == 'false'
        working-directory: packages/auth-client
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

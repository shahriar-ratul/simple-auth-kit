name: Publish auth-client

# Runs whenever packages/auth-client changes on main. Publishing is gated on the version in
# package.json actually being new — bump it as part of your commit to trigger a release;
# pushing without a version bump is a no-op (the compare-versions step just skips publish).
on:
  push:
    branches: [main]
    paths:
      - "packages/auth-client/**"
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # packages/auth-client is a real member of this repo's pnpm workspace (see
      # pnpm-workspace.yaml — "packages/*"), so it's installed the same way the rest of the repo
      # is: `pnpm install`. A fresh CI checkout has no pre-hoisted node_modules to fall back on
      # (unlike a local machine that already ran a root `pnpm install`), and plain `npm install`
      # from scratch here hits npm's known arborist crash ("Cannot read properties of null
      # (reading 'edgesOut')") — pnpm doesn't have that bug and is this repo's actual package
      # manager anyway. `npm publish` at the end is still plain npm — that part talks to the npm
      # registry directly and has nothing to do with how dependencies got installed.
      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: "https://registry.npmjs.org"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        working-directory: packages/auth-client
        run: pnpm run typecheck

      - name: Test
        working-directory: packages/auth-client
        run: pnpm run test

      - name: Build
        working-directory: packages/auth-client
        run: pnpm run build

      # Publishes whenever package.json's version differs from what's already live on npm (see
      # .github/scripts/compare-versions.mjs for the exact rule and its tradeoffs).
      - name: Compare versions
        id: version-check
        working-directory: packages/auth-client
        run: |
          LOCAL_VERSION=$(node -p "require('./package.json').version")
          PKG_NAME=$(node -p "require('./package.json').name")
          PUBLISHED_VERSION=$(npm view "$PKG_NAME" version 2>/dev/null || echo "")
          node ../../.github/scripts/compare-versions.mjs "$LOCAL_VERSION" "$PUBLISHED_VERSION"

      - name: Publish to npm
        if: steps.version-check.outputs.skip == 'false'
        working-directory: packages/auth-client
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
